# Every push and pull request: runs the tests and builds the firmware.
# On main, when FW_VERSION (src/app.h) is a version not released yet: creates the release
# v<version> with the .bin files and publishes the web flasher (site/) on GitHub Pages.
# So releasing = merging a change that bumps FW_VERSION. The boards find it by themselves.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.rel.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - name: Tests (iCal reader, RSS reader, terminal)
        run: |
          g++ -Wall -o /tmp/ical-test tests/ical/teste.cpp src/ical.cpp && /tmp/ical-test tests/ical/exemplo.ics
          g++ -Wall -o /tmp/rss-test tests/rss/teste.cpp src/rss.cpp && /tmp/rss-test
          g++ -Wall -o /tmp/vt-test tests/vt/teste.cpp src/vt.cpp && /tmp/vt-test
      - name: Build
        run: |
          pip install platformio "esptool>=5,<6"
          pio run
      - name: Collect binaries and manifest
        run: |
          VERSION=$(sed -n 's/#define FW_VERSION "\(.*\)"/\1/p' src/app.h)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          B=.pio/build/cyd
          mkdir -p site/firmware
          cp $B/bootloader.bin $B/partitions.bin $B/firmware.bin site/firmware/
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin site/firmware/
          # full image for other flashers (erases the saved settings: it covers the NVS area)
          python -m esptool --chip esp32 merge-bin -o site/firmware/cybercydeck-$VERSION-full.bin \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 site/firmware/boot_app0.bin 0x10000 $B/firmware.bin
          cp $B/firmware.bin site/firmware/cybercydeck-$VERSION-ota.bin
          # the web flasher writes the parts and skips 0x9000 (NVS): Wi-Fi and settings survive an update
          cat > site/manifest.json <<JSON
          {
            "name": "CyberCYDeck",
            "version": "$VERSION",
            "new_install_prompt_erase": true,
            "new_install_improv_wait_time": 0,
            "builds": [{
              "chipFamily": "ESP32",
              "parts": [
                { "path": "firmware/bootloader.bin", "offset": 4096 },
                { "path": "firmware/partitions.bin", "offset": 32768 },
                { "path": "firmware/boot_app0.bin", "offset": 57344 },
                { "path": "firmware/firmware.bin", "offset": 65536 }
              ]
            }]
          }
          JSON
          sed -i "s/__VERSION__/$VERSION/g" site/index.html
          (cd site/firmware && sha256sum cybercydeck-*.bin > SHA256SUMS.txt)
      - name: Release (only new versions, only on main)
        id: rel
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION já publicada: nada a fazer"; echo "new=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "CyberCYDeck $VERSION" --generate-notes \
              site/firmware/cybercydeck-$VERSION-ota.bin site/firmware/cybercydeck-$VERSION-full.bin site/firmware/SHA256SUMS.txt
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.rel.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        with:
          path: site

  pages:
    needs: build
    if: github.ref == 'refs/heads/main' && (needs.build.outputs.new == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
